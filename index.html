<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunroof 3-Stage Switch</title>
  <!-- digital.auto syncer: links this widget to Playground signals -->
  <script defer src="https://bestudio.digitalauto.tech/project/BzR91b49OHqj/syncer.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 10px; user-select: none; margin: 0; }
    .btn { width: 120px; height: 60px; margin: 8px; font-size: 18px; font-weight: bold;
           border: none; border-radius: 10px; color: white; cursor: pointer; touch-action: none; }
    #openBtn  { background: #2e7d32; }
    #closeBtn { background: #c62828; }
    .btn.active { transform: scale(0.95); filter: brightness(1.3); }
    #state { margin-top: 12px; font-size: 22px; font-weight: bold; }
    #live  { margin-top: 6px; font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <button id="openBtn"  class="btn">OPEN</button>
  <button id="closeBtn" class="btn">CLOSE</button>

  <div id="state">STABLE</div>
  <!-- Live value of the signal, filled automatically by syncer.js -->
  <div id="live">Signal: <span vss="true" vss-name="Vehicle.Test.Sunroof"></span></div>

  <script>
    const API = "Vehicle.Test.Sunroof";

    // ===== CONFIG: match the Data Type of Vehicle.Test.Sunroof in the Playground =====
    // Signal is string  -> keep these values.
    // Signal is int8    -> change to: OPEN: 1, STABLE: 0, CLOSE: -1
    const VALUES = { OPEN: "OPEN", STABLE: "STABLE", CLOSE: "CLOSE" };
    // ================================================================================

    let current = VALUES.STABLE;

    // >>> Put the Playground "set value" call here (found in syncer.js) <<<
    function writeVss(api, value) {
      console.log("SET", api, value);
    }

    function label(value) {
      if (value === VALUES.OPEN) return "OPEN";
      if (value === VALUES.CLOSE) return "CLOSE";
      return "STABLE";
    }

    function setState(value) {
      if (value === current) return;
      current = value;
      document.getElementById("state").innerText = label(value);
      writeVss(API, value);
    }

    function bindHold(btn, valueWhileHeld) {
      const press = (e) => { e.preventDefault(); btn.setPointerCapture?.(e.pointerId);
                             btn.classList.add("active"); setState(valueWhileHeld); };
      const release = () => { btn.classList.remove("active"); setState(VALUES.STABLE); };
      btn.addEventListener("pointerdown", press);
      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
      btn.addEventListener("lostpointercapture", release);
      btn.addEventListener("contextmenu", e => e.preventDefault());
    }

    bindHold(document.getElementById("openBtn"),  VALUES.OPEN);
    bindHold(document.getElementById("closeBtn"), VALUES.CLOSE);
  </script>
</body>
</html>
